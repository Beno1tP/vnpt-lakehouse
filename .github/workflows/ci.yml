# Task 2 step 2.0b: checks on every PR (and on main). Fast, no images pushed. Actions pinned by commit SHA.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"            # = Python of the Spark image (3.10.12)
      - name: Install pinned tools + the job's pure-Python deps (no Spark), same file as make venv
        run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  manifests:
    name: kustomize render (dummy secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render secrets from the example with dummy values, then kustomize
        run: |
          sed 's/change-me-[a-z-]*/ci-dummy-value-1/' infra/k8s/secrets.env.example > "$RUNNER_TEMP/secrets.env"
          python3 infra/k8s/render-secrets.py "$RUNNER_TEMP/secrets.env"
          kubectl version --client
          kubectl kustomize infra/k8s > "$RUNNER_TEMP/rendered.yaml"
          grep '^kind:' "$RUNNER_TEMP/rendered.yaml" | sort | uniq -c
          # 2.7: every rendered image is pinned by digest (kustomize images: rewrites ours)
          if grep -E '^\s*image:' "$RUNNER_TEMP/rendered.yaml" | grep -v '@sha256:' | grep -v '__IMAGE__'; then
            echo "image without digest"; exit 1; fi
          # Task 5: Superset web, its own kustomization (applied by make superset-up)
          kubectl kustomize infra/k8s/superset > "$RUNNER_TEMP/superset.yaml"
          grep '^kind:' "$RUNNER_TEMP/superset.yaml" | sort | uniq -c
          grep -E '^\s*image:' "$RUNNER_TEMP/superset.yaml"
          if grep -E '^\s*image:' "$RUNNER_TEMP/superset.yaml" | grep -v '@sha256:'; then echo "image without digest"; exit 1; fi

  dags:
    name: DAG integrity (inside the Airflow image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Airflow image locally on the runner (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dags
          file: docker/airflow/Dockerfile
          build-contexts: |
            plugins=plugins
            expected=tests/expected
            trino_sql=sql/trino
          load: true
          tags: vnpt-lake-airflow:ci
      - name: Import every DAG and check the rules
        run: docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=False -v "$PWD/tests/dags:/tests:ro" vnpt-lake-airflow:ci python /tests/test_dag_integrity.py

  dockerfiles:
    name: Dockerfile checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build --check (BuildKit lint rules, no build)
        run: |
          docker build --check docker/spark
          docker build --check docker/hive
          docker build --check -f docker/airflow/Dockerfile --build-context plugins=plugins \
            --build-context expected=tests/expected --build-context trino_sql=sql/trino dags/
          docker build --check -f docker/spark-job/Dockerfile --build-context tests=tests \
            --build-arg BASE_IMAGE=apache/spark:3.5.9-scala2.12-java17-python3-ubuntu@sha256:f3d6eaa8bab8ec2e38f3c3918a5b2f8b253c95bcb19f9e87ad0e0cdacf9df2d5 jobs/
          docker build --check -f docker/dbt/Dockerfile --build-context req=docker/dbt --build-context scripts=scripts dbt/
          docker build --check docker/superset

  dbt-lint:
    name: dbt-lint (dbt parse inside the dbt image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the dbt image locally on the runner (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dbt
          file: docker/dbt/Dockerfile
          build-contexts: |
            req=docker/dbt
            scripts=scripts
          load: true
          tags: vnpt-lake-dbt:ci
      - name: dbt --version, dbt parse (project, sources, seeds; no connection), init script imports
        run: |
          docker run --rm vnpt-lake-dbt:ci dbt --version
          docker run --rm -e STARROCKS_PASSWORD=ci-dummy vnpt-lake-dbt:ci dbt parse
          docker run --rm vnpt-lake-dbt:ci python -c "import mysql.connector; print('mysql-connector', mysql.connector.__version__)"

  superset-image:
    name: superset-image (build, pip check, StarRocks dialect, superset CLI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Superset image locally on the runner (not pushed; uv pip check runs inside the build, D26)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/superset
          load: true
          tags: vnpt-lake-superset:ci
      - name: Dialect registered, drivers import, Superset's own pins unchanged, CLI runs
        run: |
          docker run --rm vnpt-lake-superset:ci python -c "import sqlalchemy as sa, starrocks, psycopg2, yaml, requests; e = sa.create_engine('starrocks://u:p@h:9030/default_catalog.gold'); print('dialect', e.dialect.name, '| sqlalchemy', sa.__version__, '| psycopg2', psycopg2.__version__)"
          docker run --rm -e UV_NO_CACHE=1 apache/superset:6.1.0@sha256:16b50bbef6648912a79e3293d418fefa743ce555d36c5af6b85d859119ed7f88 sh -c ". /app/.venv/bin/activate && uv pip freeze --exclude-editable" | sort > base.txt
          docker run --rm -e UV_NO_CACHE=1 vnpt-lake-superset:ci sh -c ". /app/.venv/bin/activate && uv pip freeze --exclude-editable" | sort > ours.txt
          for f in base.txt ours.txt; do n=$(wc -l < $f); echo "$f: $n packages"; [ "$n" -gt 50 ] || { echo "FAIL: the freeze for $f returned too few packages (E79: check the command, not a package change)"; exit 1; }; done
          docker run --rm vnpt-lake-superset:ci sh -c "find /app/superset_home -maxdepth 2 ! -user superset" | tee root-owned.txt
          if [ -s root-owned.txt ]; then echo "FAIL: files in /app/superset_home not owned by superset (E79)"; exit 1; fi
          echo "packages added (only the dialect, the drivers and their new dependencies may appear; nothing removed or changed):"
          comm -13 base.txt ours.txt
          if comm -23 base.txt ours.txt | grep .; then echo "FAIL: a Superset package was changed or removed (above)"; exit 1; fi
          docker run --rm -e SUPERSET_SECRET_KEY=ci-dummy-key-not-used-anywhere vnpt-lake-superset:ci superset version
          docker run --rm vnpt-lake-superset:ci id   # = runAsUser in infra/k8s/superset/superset.yaml (5.3a)
          # our superset_config.py loads inside Superset (dummy env, no connection): the override is really applied
          docker run --rm -v "$PWD/infra/k8s/superset:/app/pythonpath:ro" -e SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py \
            -e SUPERSET_SECRET_KEY=ci-dummy -e DB_USER=u -e DB_PASS=p -e DB_HOST=h -e DB_PORT=5432 -e DB_NAME=d vnpt-lake-superset:ci \
            python -c "from superset import config as c; assert c.SQL_MAX_ROW == 10000 and c.SECRET_KEY == 'ci-dummy', 'override not applied'; print('config loaded, db', c.SQLALCHEMY_DATABASE_URI.split('@')[1])"
          # E82: result-set column typing for StarRocks does `import MySQLdb` + MySQLdb.constants.FIELD_TYPE: after our
          # config, that must resolve to PyMySQL. (The engine spec itself needs an app context: checked in Job superset-init)
          docker run --rm -v "$PWD/infra/k8s/superset:/app/pythonpath:ro" -e SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py \
            -e SUPERSET_SECRET_KEY=ci-dummy -e DB_USER=u -e DB_PASS=p -e DB_HOST=h -e DB_PORT=5432 -e DB_NAME=d vnpt-lake-superset:ci \
            python -c "from superset import config; import MySQLdb, pymysql; ft = MySQLdb.constants.FIELD_TYPE; assert MySQLdb is pymysql and ft.VAR_STRING == 253, (MySQLdb, ft.VAR_STRING); print('MySQLdb ->', MySQLdb.__name__, '| FIELD_TYPE.VAR_STRING =', ft.VAR_STRING)"
