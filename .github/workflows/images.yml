# Task 2 step 2.0b (D5): build images on GitHub, scan them, push to GHCR. The laptop only pulls.
# Base images (spark, hms) have version tags and are built only when that tag is missing in GHCR:
# bump the -rN suffix below whenever docker/spark or docker/hive changes. Code images are tagged with the git SHA.
name: images
on:
  push:
    branches: [main]
    paths: ["docker/**", "jobs/**", "dags/**", "plugins/**", "tests/expected/**", "tests/sql/**", "sql/**", ".github/workflows/images.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io/beno1tp                 # GHCR names must be lowercase
  SOURCE_LABEL: org.opencontainers.image.source=https://github.com/${{ github.repository }}

jobs:
  base:
    name: base ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: vnpt-lake-spark, dir: docker/spark, tag: "3.5.9-iceberg1.11.0-r1" }
          - { name: vnpt-lake-hms,   dir: docker/hive,  tag: "3.1.3-hadoopaws3.1.0-r1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already in GHCR?
        id: exists
        run: |
          if docker buildx imagetools inspect "$REGISTRY/${{ matrix.name }}:${{ matrix.tag }}" >/dev/null 2>&1; then
            echo "built=false" >> "$GITHUB_OUTPUT"; echo "exists, not rebuilt"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.exists.outputs.built == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          push: true
          provenance: false                   # single-platform image, plain manifest digest
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ matrix.tag }}
          labels: ${{ env.SOURCE_LABEL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan (report only, see 03_plan.md §G)
        if: steps.exists.outputs.built == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ matrix.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy.json
      - name: Digest + scan summary (also printed to the log)
        run: |
          ref="$REGISTRY/${{ matrix.name }}:${{ matrix.tag }}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["digest"])')
          line="| ${{ matrix.name }} | \`${{ matrix.tag }}\` | \`$digest\` | built=${{ steps.exists.outputs.built }} |"
          echo "DIGEST $line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy.json ]; then python3 .github/scripts/trivy_counts.py trivy.json | tee -a "$GITHUB_STEP_SUMMARY"; fi

  spark-job:
    name: spark-job (code image)
    needs: base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the spark base digest
        id: base
        run: |
          ref="$REGISTRY/vnpt-lake-spark:3.5.9-iceberg1.11.0-r1"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["digest"])')
          echo "ref=$REGISTRY/vnpt-lake-spark@$digest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: jobs
          file: docker/spark-job/Dockerfile
          build-contexts: tests=tests
          build-args: BASE_IMAGE=${{ steps.base.outputs.ref }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/vnpt-lake-spark-job:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
      - name: Scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/vnpt-lake-spark-job:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy.json
      - name: Digest + scan summary (also printed to the log)
        run: |
          ref="$REGISTRY/vnpt-lake-spark-job:${{ github.sha }}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["digest"])')
          line="| vnpt-lake-spark-job | \`${{ github.sha }}\` | \`$digest\` | base \`${{ steps.base.outputs.ref }}\` |"
          echo "DIGEST $line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/trivy_counts.py trivy.json | tee -a "$GITHUB_STEP_SUMMARY"

  airflow:
    name: airflow (DAGs baked)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dags
          file: docker/airflow/Dockerfile
          build-contexts: |
            plugins=plugins
            expected=tests/expected
            trino_sql=sql/trino
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/vnpt-lake-airflow:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
          cache-from: type=gha,scope=vnpt-lake-airflow
          cache-to: type=gha,mode=max,scope=vnpt-lake-airflow
      - name: Scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/vnpt-lake-airflow:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy.json
      - name: Digest + scan summary (also printed to the log)
        run: |
          ref="$REGISTRY/vnpt-lake-airflow:${{ github.sha }}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["digest"])')
          line="| vnpt-lake-airflow | \`${{ github.sha }}\` | \`$digest\` | base apache/airflow:3.3.2-python3.12 |"
          echo "DIGEST $line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/trivy_counts.py trivy.json | tee -a "$GITHUB_STEP_SUMMARY"
