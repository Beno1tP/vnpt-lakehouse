# pre-commit hooks (lab doc: "pre-commit install", "pre-commit run --all-files"). Versions pinned; same ruff as CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^dags/templates/      # Jinja templates are not plain YAML until rendered (CI renders them)
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]            # data files (xlsx, parquet) never belong in Git
      - id: detect-private-key
      - id: check-merge-conflict
