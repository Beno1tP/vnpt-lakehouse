# Task 2 step 2.5b drill 7: one run of jobs/catalog_tool.py (applied by `make catalog CMD=… ARGS=…`, not by Airflow).
# __NAME__, __IMAGE__ and __ARGS__ (a JSON list of strings) are filled by make. Same catalog config as bronze.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: __NAME__
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "3.5.9"
  image: __IMAGE__
  imagePullPolicy: IfNotPresent
  imagePullSecrets: [ghcr-pull]
  mainApplicationFile: local:///opt/jobs/catalog_tool.py
  arguments: __ARGS__
  restartPolicy: { type: Never }
  timeToLiveSeconds: 86400
  sparkConf:
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.lake: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lake.type: hive
    spark.sql.catalog.lake.uri: thrift://hive-metastore.lake.svc.cluster.local:9083
    spark.sql.catalog.lake.warehouse: s3a://lakehouse/warehouse
    spark.sql.catalog.lake.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.lake.s3.endpoint: http://minio.lake.svc.cluster.local:9000
    spark.sql.catalog.lake.s3.path-style-access: "true"
    spark.sql.catalog.lake.client.region: us-east-1
    spark.sql.defaultCatalog: lake
    spark.sql.session.timeZone: Asia/Ho_Chi_Minh
    spark.eventLog.enabled: "true"                # Spark UI after the run: make history-ui (lab: PVC, prod: s3a)
    spark.eventLog.dir: file:///spark-events
    spark.eventLog.compress: "true"
  volumes:
    - { name: spark-events, persistentVolumeClaim: { claimName: spark-events } }   # infra/k8s/spark-jobs/spark-events-pvc.yaml
  driver:
    cores: 1
    memory: 1g
    memoryOverhead: 512m
    serviceAccount: spark-operator-spark
    volumeMounts: [{ name: spark-events, mountPath: /spark-events }]   # only the driver writes the event log
    labels: { app: catalog }
    env: [{ name: AWS_REGION, value: us-east-1 }]
    envFrom: [{ secretRef: { name: s3-credentials } }]
  executor:
    instances: 1
    cores: 1
    memory: 768m
    memoryOverhead: 384m
    labels: { app: catalog }
    env: [{ name: AWS_REGION, value: us-east-1 }]
    envFrom: [{ secretRef: { name: s3-credentials } }]
