# Task 2 manifests. Apply: kubectl apply -k infra/k8s   (grows one component per step, docs/task2/03_plan.md §C)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - lake/postgres.yaml
  - lake/minio.yaml
  - lake/bucket-init-job.yaml
  - lake/hive-metastore.yaml
  - lake/minio-users-job.yaml
  - spark-jobs/rbac-airflow.yaml
  - lake/pg-backup-cronjob.yaml
  - spark-jobs/spark-events-pvc.yaml
  - spark-jobs/spark-history.yaml
  - trino-rbac-airflow.yaml
  - gold-jobs/rbac.yaml
  - lake/superset-db-init-job.yaml
images:                                # GHCR digests (2.0c); keep equal to infra/k8s/images.env (checked by CI)
  - name: ghcr.io/beno1tp/vnpt-lake-hms
    digest: sha256:9446f7d1e0ab211f1fe32b0f8def318699e6afa40a5e1fcebfa3d07d134b91ff
  - name: ghcr.io/beno1tp/vnpt-lake-spark
    digest: sha256:aee0deb990471c57e37936f10aa6f91880ef7cff3713e09a4cc974d5bb0cad5c
secretGenerator:                       # from files rendered by `make k8s-secrets` (git-ignored)
  - name: postgres-credentials
    namespace: lake
    envs: [secrets/postgres.env]
  - name: minio-credentials
    namespace: lake
    envs: [secrets/minio.env]
  - name: hms-hive-site
    namespace: lake
    files: [secrets/hive-site.xml]
  - name: s3-credentials                # MinIO user spark-jobs (2.1b). Referenced by SparkApplications and Airflow
    namespace: spark-jobs               # templates outside kustomize, so the name must stay stable (no hash suffix)
    envs: [secrets/s3.env]
    options: { disableNameSuffixHash: true }
  - name: landing-writer-credentials    # MinIO user landing-writer (landing simulator pod, outside kustomize)
    namespace: spark-jobs
    envs: [secrets/landing-writer.env]
    options: { disableNameSuffixHash: true }
  - name: trino-s3-credentials          # Task 3: MinIO user trino for the Trino catalog (Helm envFrom by fixed name)
    namespace: trino
    envs: [secrets/trino-s3.env]
    options: { disableNameSuffixHash: true }
  - name: starrocks-root                # Task 4: StarRocks root password (chart initPassword.passwordSecret, fixed name)
    namespace: starrocks
    envs: [secrets/starrocks-root.env]
    options: { disableNameSuffixHash: true }
  - name: starrocks-init-credentials    # Task 4 4.2: Job starrocks-init (root, user passwords, catalog S3 key)
    namespace: starrocks
    envs: [secrets/starrocks-init.env]
    options: { disableNameSuffixHash: true }
  - name: starrocks-dbt-credentials     # Task 4: dbt pods connect as dbt_rw (STARROCKS_PASSWORD); 4.5: in gold-jobs
    namespace: gold-jobs
    envs: [secrets/starrocks-dbt.env]
    options: { disableNameSuffixHash: true }
  - name: starrocks-access-test-credentials # MinIO user starrocks with AWS_* names, only for make s3-access-test
    namespace: spark-jobs
    envs: [secrets/starrocks-access-test.env]
    options: { disableNameSuffixHash: true }
  - name: trino-access-test-credentials # same user with AWS_* names, only for make s3-access-test
    namespace: spark-jobs
    envs: [secrets/trino-access-test.env]
    options: { disableNameSuffixHash: true }
  - name: demo-viewer-credentials       # MinIO user demo-viewer, only for make s3-access-test (negative test)
    namespace: spark-jobs
    envs: [secrets/demo-viewer.env]
    options: { disableNameSuffixHash: true }
  - name: superset-db-credentials       # Task 5 5.2: password of the Postgres role superset (Job superset-db-init)
    namespace: lake
    envs: [secrets/superset-db.env]
  - name: superset-env                  # Task 5: SECRET_KEY + metadata DB (DB_*) for every Superset pod (fixed name)
    namespace: superset
    envs: [secrets/superset-env.env]
    options: { disableNameSuffixHash: true }
  - name: superset-init-credentials     # Task 5: admin + bi_ro passwords, only for the Job superset-init (D21)
    namespace: superset
    envs: [secrets/superset-init.env]
    options: { disableNameSuffixHash: true }
  - name: minio-service-users           # passwords for the minio-users Job
    namespace: lake
    envs: [secrets/minio-service-users.env]
  - name: hms-s3-credentials            # MinIO user hive-metastore
    namespace: lake
    envs: [secrets/hms-s3.env]
  # Airflow chart (step 2.3) reads these by fixed name (values-local.yaml), so no hash suffix
  - { name: airflow-metadata, namespace: airflow, envs: [secrets/airflow-metadata.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-fernet-key, namespace: airflow, envs: [secrets/airflow-fernet.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-api-secret-key, namespace: airflow, envs: [secrets/airflow-api.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-jwt-secret, namespace: airflow, envs: [secrets/airflow-jwt.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-connections, namespace: airflow, envs: [secrets/airflow-connections.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-alerts, namespace: airflow, envs: [secrets/airflow-alerts.env], options: { disableNameSuffixHash: true } }
  # GHCR pull secret (2.0c), rendered from GHCR_PULL_TOKEN (2.8); referenced by name in pods, templates and the chart
  - { name: ghcr-pull, namespace: lake, type: kubernetes.io/dockerconfigjson, files: [.dockerconfigjson=secrets/ghcr-dockerconfig.json], options: { disableNameSuffixHash: true } }
  - { name: ghcr-pull, namespace: spark-jobs, type: kubernetes.io/dockerconfigjson, files: [.dockerconfigjson=secrets/ghcr-dockerconfig.json], options: { disableNameSuffixHash: true } }
  - { name: ghcr-pull, namespace: airflow, type: kubernetes.io/dockerconfigjson, files: [.dockerconfigjson=secrets/ghcr-dockerconfig.json], options: { disableNameSuffixHash: true } }
  - { name: ghcr-pull, namespace: gold-jobs, type: kubernetes.io/dockerconfigjson, files: [.dockerconfigjson=secrets/ghcr-dockerconfig.json], options: { disableNameSuffixHash: true } }
  - { name: ghcr-pull, namespace: superset, type: kubernetes.io/dockerconfigjson, files: [.dockerconfigjson=secrets/ghcr-dockerconfig.json], options: { disableNameSuffixHash: true } }
  - { name: ghcr-pull, namespace: starrocks, type: kubernetes.io/dockerconfigjson, files: [.dockerconfigjson=secrets/ghcr-dockerconfig.json], options: { disableNameSuffixHash: true } }
configMapGenerator:
  - name: starrocks-init-sql            # Task 4: statements of the Job starrocks-init (applied by make, fixed name)
    namespace: starrocks
    files: [starrocks/init.sql]
    options: { disableNameSuffixHash: true }
  - name: postgres-initdb
    namespace: lake
    files: [lake/postgres-initdb/10-airflow-db.sh]
  - name: bucket-init-script
    namespace: lake
    files: [lake/bucket-init/bucket_init.py]
  - name: hms-core-site
    namespace: lake
    files: [lake/hive/core-site.xml]
  - name: minio-users-script
    namespace: lake
    files: [lake/minio-users/minio_users.sh, lake/minio-users/lake-spark-jobs.json,
            lake/minio-users/lake-landing-writer.json, lake/minio-users/lake-hms.json,
            lake/minio-users/lake-landing-reader.json, lake/minio-users/lake-airflow-logs.json,
            lake/minio-users/lake-backup.json, lake/minio-users/lake-demo-viewer.json, lake/minio-users/lake-trino-read.json,
            lake/minio-users/lake-starrocks-read.json]
