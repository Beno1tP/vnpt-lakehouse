# Task 2 manifests. Apply: kubectl apply -k infra/k8s   (grows one component per step, docs/task2/03_plan.md §C)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - lake/postgres.yaml
  - lake/minio.yaml
  - lake/bucket-init-job.yaml
  - lake/hive-metastore.yaml
secretGenerator:                       # from files rendered by `make k8s-secrets` (git-ignored)
  - name: postgres-credentials
    namespace: lake
    envs: [secrets/postgres.env]
  - name: minio-credentials
    namespace: lake
    envs: [secrets/minio.env]
  - name: hms-hive-site
    namespace: lake
    files: [secrets/hive-site.xml]
  - name: s3-credentials                # referenced by SparkApplications and Airflow templates outside kustomize,
    namespace: spark-jobs               # so the name must stay stable (no hash suffix)
    envs: [secrets/s3.env]
    options: { disableNameSuffixHash: true }
  # Airflow chart (step 2.3) reads these by fixed name (values-local.yaml), so no hash suffix
  - { name: airflow-metadata, namespace: airflow, envs: [secrets/airflow-metadata.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-fernet-key, namespace: airflow, envs: [secrets/airflow-fernet.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-api-secret-key, namespace: airflow, envs: [secrets/airflow-api.env], options: { disableNameSuffixHash: true } }
  - { name: airflow-jwt-secret, namespace: airflow, envs: [secrets/airflow-jwt.env], options: { disableNameSuffixHash: true } }
configMapGenerator:
  - name: postgres-initdb
    namespace: lake
    files: [lake/postgres-initdb/10-airflow-db.sh]
  - name: bucket-init-script
    namespace: lake
    files: [lake/bucket-init/bucket_init.py]
  - name: hms-core-site
    namespace: lake
    files: [lake/hive/core-site.xml]
