# Task 2 step 2.1b: one-shot Job = Task 1's minio-init. Idempotent; deleted 10 min after it finishes, so the next
# `kubectl apply -k` recreates and reruns it (a finished Job cannot be updated in place: its pod template is immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: bucket-init
  namespace: lake
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        fsGroup: 185                       # uid/gid "spark" in the image: secret files readable (lesson E27)
      containers:
        - name: bucket-init
          image: ghcr.io/beno1tp/vnpt-lake-spark   # digest set in kustomization.yaml (images:)
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/bucket_init.py"]
          env:
            - { name: S3_ENDPOINT, value: "minio.lake.svc.cluster.local:9000" }
            - { name: BUCKETS, value: "lakehouse landing airflow-logs" }   # airflow-logs: remote task logs (2.6)
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits:   { memory: 256Mi }
          volumeMounts:
            - { name: credentials, mountPath: /run/secrets/minio, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: credentials
          secret: { secretName: minio-credentials, defaultMode: 0440 }
        - name: scripts
          configMap: { name: bucket-init-script }
