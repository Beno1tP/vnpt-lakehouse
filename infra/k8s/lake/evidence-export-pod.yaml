# Freeze step 2 (B2): one-off pod for `make evidence-export`. Not in kustomization (like pg-restore-job.yaml):
# __IMAGE__ = spark-job image (pyarrow + tar for kubectl cp); __USERS_SECRET__ = the current hashed name of
# minio-service-users, read from cronjob/pg-backup at run time (a fixed name here would break like E54).
apiVersion: v1
kind: Pod
metadata:
  name: evidence-export
  namespace: lake
spec:
  restartPolicy: Never
  imagePullSecrets: [{ name: ghcr-pull }]
  activeDeadlineSeconds: 1800                # safety net: ends after 30 min even if never deleted
  securityContext:
    fsGroup: 185                             # uid/gid "spark" (lesson E27)
  containers:
    - name: export
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: ["sleep", "1800"]             # idle until make runs the script with kubectl exec
      env:
        - { name: S3_ENDPOINT, value: "minio.lake.svc.cluster.local:9000" }
        - name: MINIO_DEMO_VIEWER_SECRET     # read-only user (airflow-logs)
          valueFrom: { secretKeyRef: { name: __USERS_SECRET__, key: MINIO_DEMO_VIEWER_SECRET } }
        - name: MINIO_BACKUP_SECRET          # list/read backup, cannot delete
          valueFrom: { secretKeyRef: { name: __USERS_SECRET__, key: MINIO_BACKUP_SECRET } }
      resources:
        requests: { memory: 256Mi, cpu: 100m }
        limits:   { memory: 512Mi }
      volumeMounts:
        - { name: export, mountPath: /export }
        - { name: script, mountPath: /scripts, readOnly: true }
  volumes:
    - name: export
      emptyDir: { sizeLimit: 1Gi }
    - name: script
      configMap: { name: evidence-export }
