# Task 2 step 2.1c: Hive Metastore 3.1.3 (thin image from Task 1, loaded into Minikube).
# Schema init = initContainer (same check-then-create logic as Task 1's hms-schema-init): runs before every HMS start,
# creates the schema only when Postgres has none, stops on any other error. JDBC settings: hive-site.xml secret file.
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: lake
spec:
  selector: { app: hive-metastore }
  ports: [{ name: thrift, port: 9083 }]   # thrift://hive-metastore.lake.svc.cluster.local:9083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lake
spec:
  replicas: 1
  strategy: { type: Recreate }            # never two HMS pods at once (RAM budget)
  selector:
    matchLabels: { app: hive-metastore }
  template:
    metadata:
      labels: { app: hive-metastore }
    spec:
      securityContext:
        fsGroup: 1000                       # uid/gid "hive" in the image: secret file readable (lesson E27)
      initContainers:
        - name: schema-init
          image: vnpt-lake-hms:3.1.3-hadoopaws3.1.0-r1
          imagePullPolicy: Never            # loaded with `minikube image load`
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              for i in $(seq 1 60); do                       # wait for Postgres (bash /dev/tcp, no extra tools)
                (echo > /dev/tcp/postgres.lake.svc.cluster.local/5432) 2>/dev/null && break
                echo "waiting for postgres ($i/60)"; sleep 2
              done
              ST=/opt/hive/bin/schematool
              if out=$($ST -dbType postgres -info 2>&1); then
                if grep -q "Metastore schema version:[[:space:]]*3.1.0" <<<"$out"; then
                  echo "HMS schema 3.1.0 exists, nothing to do"
                else
                  echo "ERROR: unexpected schema version:" >&2; grep -i "version" <<<"$out" >&2 || true; exit 1
                fi
              elif grep -q 'relation "VERSION" does not exist' <<<"$out"; then
                echo "No HMS schema yet -> schematool -initSchema"
                $ST -dbType postgres -initSchema 2>&1 | grep -v -i password | tail -n 5
                $ST -dbType postgres -info 2>&1 | grep "Metastore schema version"
              else
                echo "ERROR: schematool -info failed for another reason (NOT 'no schema'); refusing to init:" >&2
                grep -v -i password <<<"$out" | tail -n 15 >&2
                exit 1
              fi
          env:
            - { name: HADOOP_CLIENT_OPTS, value: "-Xmx768m" }
          resources:
            requests: { memory: 768Mi, cpu: 200m }
            limits:   { memory: 1Gi }
          volumeMounts:
            - { name: hive-site, mountPath: /opt/hive/conf/hive-site.xml, subPath: hive-site.xml, readOnly: true }
      containers:
        - name: hive-metastore
          image: vnpt-lake-hms:3.1.3-hadoopaws3.1.0-r1
          imagePullPolicy: Never
          env:
            - { name: SERVICE_NAME, value: metastore }
            - { name: DB_DRIVER, value: postgres }
            - { name: IS_RESUME, value: "true" }        # entrypoint never inits; the initContainer does (E07, E19)
            - { name: SERVICE_OPTS, value: "-Xmx768m" }  # no credentials here (the entrypoint prints it with set -x)
            - name: AWS_ACCESS_KEY_ID                    # S3A EnvironmentVariableCredentialsProvider (phase 2: per-service key)
              valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD } }
          ports: [{ name: thrift, containerPort: 9083 }]
          readinessProbe:
            tcpSocket: { port: 9083 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9083 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { memory: 768Mi, cpu: 200m }
            limits:   { memory: 1Gi }               # -Xmx768m = 75 % of 1Gi
          volumeMounts:
            - { name: hive-site, mountPath: /opt/hive/conf/hive-site.xml, subPath: hive-site.xml, readOnly: true }
            - { name: core-site, mountPath: /opt/hadoop/etc/hadoop/core-site.xml, subPath: core-site.xml, readOnly: true }
      volumes:
        - name: hive-site
          secret: { secretName: hms-hive-site, defaultMode: 0440 }
        - name: core-site
          configMap: { name: hms-core-site }
