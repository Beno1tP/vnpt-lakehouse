# Task 5 step 5.3b (D21): what needs the admin password, outside the web pod. Waits until the web pod answers /health
# (its init container has migrated the schema), creates the admin user or resets its password to the Secret's value,
# then verifies role + password itself. Idempotent; make superset-up deletes and re-applies it (a Job is immutable).
# 5.4: registers the StarRocks connection "StarRocks Gold" as bi_ro (read-only flags) and proves it through the
# stored connection: count of gold.fct_user_message = 10,613 (Task 4 gold-check) and CREATE TABLE -> Access denied.
# 5.5: then loads the datasets + metrics (datasets.yaml) and checks every metric in StarRocks.
# 5.8b: imports the dashboard bundle (assets/ zipped, ConfigMap superset-assets) between two connection runs.
# Never prints a password (create/reset output is filtered; URIs are printed masked).
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init
  namespace: superset
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ghcr-pull }]
      automountServiceAccountToken: false
      enableServiceLinks: false            # E81: no SUPERSET_* service-link variables in Superset's environment
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: superset-init
          image: ghcr.io/beno1tp/vnpt-lake-superset   # digest set in kustomization.yaml (images:)
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: superset-env }
            - secretRef: { name: superset-init-credentials }   # admin, bi_ro, checker (5.7) passwords
          env:
            - { name: SUPERSET_CONFIG_PATH, value: /app/pythonpath/superset_config.py }
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "metadata db: $DB_NAME | web: ${SUPERSET_URL:=http://superset.superset.svc.cluster.local:8088}"
              export SUPERSET_URL
              python - <<'PY'
              import os, time, urllib.request
              for i in range(120):
                  try:
                      if urllib.request.urlopen(os.environ["SUPERSET_URL"] + "/health", timeout=5).status == 200:
                          print("web /health 200 (schema migrated)"); break
                  except OSError:
                      pass
                  print(f"waiting for the web pod ({i + 1}/120)"); time.sleep(5)
              else:
                  raise SystemExit("web pod not healthy after 10 min")
              PY
              # create (a no-op with a message if the user exists), then force the password to the Secret's value
              superset fab create-admin --username admin --firstname Superset --lastname Admin \
                --email admin@lab.local --password "$SUPERSET_ADMIN_PASSWORD" 2>&1 | grep -vi password || true
              superset fab reset-password --username admin --password "$SUPERSET_ADMIN_PASSWORD" 2>&1 | grep -vi password || true
              python - <<'PY'
              import os
              from werkzeug.security import check_password_hash
              from superset.app import create_app
              app = create_app()
              with app.app_context():
                  from superset.extensions import security_manager as sm
                  u = sm.find_user(username="admin")
                  assert u is not None, "admin user missing"
                  assert "Admin" in [r.name for r in u.roles], f"admin roles {[r.name for r in u.roles]}"
                  assert check_password_hash(u.password, os.environ["SUPERSET_ADMIN_PASSWORD"]), "admin password differs from the Secret"
                  print("admin ok: role Admin, password = Secret superset-init-credentials")
              PY
              connect() {   # connection (fixed uuid, real password, read-only flags) + checks; run before AND after the import
              python - <<'PY'
              import os
              from urllib.parse import quote
              from sqlalchemy import text
              from superset.app import create_app
              app = create_app()
              with app.app_context():
                  from superset import db
                  from superset.db_engine_specs.starrocks import StarRocksEngineSpec
                  from superset.utils.database import get_or_create_db
                  t = StarRocksEngineSpec.get_datatype(253)   # E82: SQL Lab's result typing path (MySQLdb shim)
                  assert t == "VAR_STRING", f"get_datatype(253) = {t}"
                  print("result typing ok: get_datatype(253) =", t)
                  pw = quote(os.environ["STARROCKS_BI_PASSWORD"], safe="")
                  uri = f"starrocks://bi_ro:{pw}@starrocks-fe-service.starrocks.svc.cluster.local:9030/default_catalog.gold"
                  d = get_or_create_db("StarRocks Gold", uri)   # creates, or updates the URI (password stored encrypted)
                  import sys; sys.path.insert(0, "/init")
                  from superset_datasets import database_uuid
                  d.uuid = database_uuid(d.database_name)       # 5.8b: fixed, so the exported bundle re-imports onto it
                  d.expose_in_sqllab = True
                  d.allow_dml = d.allow_ctas = d.allow_cvas = d.allow_file_upload = d.allow_run_async = False
                  db.session.commit()
                  print("connection ok:", d.database_name, "uuid", d.uuid, "->", d.sqlalchemy_uri)   # URI masked by Superset
                  with d.get_sqla_engine() as engine, engine.connect() as c:
                      n = c.execute(text("SELECT count(*) FROM fct_user_message")).scalar()
                      assert n == 10613, f"fct_user_message = {n}, expected 10613 (make gold-check)"
                      print("query ok as", c.execute(text("SELECT current_user()")).scalar(), "| fct_user_message =", n)
                      try:
                          c.execute(text("CREATE TABLE superset_probe (id INT) DISTRIBUTED BY HASH(id) PROPERTIES ('replication_num' = '1')"))
                      except Exception as e:  # E71: only an access error counts as the expected denial
                          assert "denied" in str(e).lower(), f"CREATE failed, but not with Access denied: {str(e)[:200]}"
                          print("read-only ok: CREATE TABLE -> Access denied")
                      else:
                          raise SystemExit("bi_ro could CREATE TABLE in gold: grants too wide")
              PY
              }
              connect
              # 5.8b: dashboard bundle from Git (ConfigMap superset-assets). The connection exists first with the same
              # uuid, so the importer updates it instead of asking for its (masked) password; connect then restores it.
              superset import-dashboards -p /assets/assets.zip -u admin
              python - <<'PY'
              import yaml
              from superset.app import create_app
              app = create_app()
              with app.app_context():
                  from superset import db
                  from superset.models.dashboard import Dashboard
                  want = yaml.safe_load(open("/init/dashboard_checks.yaml"))
                  d = db.session.query(Dashboard).filter_by(dashboard_title=want["dashboard"]).one()
                  names = sorted(c.slice_name for c in d.slices)
                  assert names == sorted(want["charts"]), f"imported charts {names}"
                  print(f"import ok: dashboard {d.dashboard_title!r} uuid {d.uuid}, {len(names)} charts, published {d.published}")
              PY
              connect
              # 5.5: datasets + metrics from datasets.yaml, each metric checked in StarRocks against gold-check values
              python /init/superset_datasets.py /init/datasets.yaml
          resources: { requests: { memory: 512Mi, cpu: 100m }, limits: { memory: 1Gi } }
          volumeMounts:
            - { name: config, mountPath: /app/pythonpath, readOnly: true }
            - { name: init-files, mountPath: /init, readOnly: true }
            - { name: assets, mountPath: /assets, readOnly: true }
      volumes:
        - name: config
          configMap: { name: superset-config }
        - name: init-files
          configMap: { name: superset-init-files }
        - name: assets
          configMap: { name: superset-assets }
