# Task 5 step 5.7: one-off pod for make superset-check (not in the kustomization: a pod is created per run).
# Logs in to Superset as the read-only user checker (Secret superset-checker-credentials only: no admin, no bi_ro,
# no metadata-DB password) and checks every chart of the dashboard (superset_check.py, dashboard_checks.yaml).
# __IMAGE__ = SUPERSET_IMAGE_REF from infra/k8s/images.env; __NAME__ / __URL__ (sed in the Makefile).
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__                          # superset-check, or superset-check-drill (5.8c)
  namespace: superset
  labels: { app: superset-check }
spec:
  restartPolicy: Never
  imagePullSecrets: [{ name: ghcr-pull }]
  automountServiceAccountToken: false
  enableServiceLinks: false               # E81
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
  containers:
    - name: check
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: ["python", "/check/superset_check.py", "/check/dashboard_checks.yaml"]
      envFrom: [{ secretRef: { name: superset-checker-credentials } }]
      env: [{ name: SUPERSET_URL, value: "__URL__" }]   # the real web Service, or the drill's (5.8c)
      resources: { requests: { memory: 128Mi, cpu: 50m }, limits: { memory: 256Mi } }
      volumeMounts: [{ name: check, mountPath: /check, readOnly: true }]
  volumes:
    - name: check
      configMap: { name: superset-check-files }
