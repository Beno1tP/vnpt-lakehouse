# Task 4 step 4.6: `make dbt-docs`: dbt docs generate --static (needs the dbt_rw connection: the catalog part reads
# column types from StarRocks), then make copies the single HTML file out. Not in kustomization (image from images.env).
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: gold-jobs
  labels: { app: dbt-docs }
spec:
  restartPolicy: Never
  serviceAccountName: dbt                   # no API token (gold-jobs/rbac.yaml)
  imagePullSecrets: [{ name: ghcr-pull }]
  activeDeadlineSeconds: 900
  containers:
    - name: dbt
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: ["sleep", "900"]
      envFrom: [{ secretRef: { name: starrocks-dbt-credentials } }]
      resources:
        requests: { memory: 512Mi, cpu: 200m }
        limits:   { memory: 512Mi }
