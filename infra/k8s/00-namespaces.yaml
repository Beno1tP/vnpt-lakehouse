# Task 2 namespaces (docs/task2/03_plan.md §B). Apply: kubectl apply -f infra/k8s/00-namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: lake                # postgres, minio, hive-metastore (storage + catalog)
  labels: { app.kubernetes.io/part-of: vnpt-lakehouse }
---
apiVersion: v1
kind: Namespace
metadata:
  name: spark-operator      # Kubeflow Spark Operator 2.2.1 (controller + webhook)
  labels: { app.kubernetes.io/part-of: vnpt-lakehouse }
---
apiVersion: v1
kind: Namespace
metadata:
  name: spark-jobs          # SparkApplications: driver + executor pods
  labels: { app.kubernetes.io/part-of: vnpt-lakehouse }
---
apiVersion: v1
kind: Namespace
metadata:
  name: airflow             # Airflow 3.3.2 (chart 1.22.0, LocalExecutor)
  labels: { app.kubernetes.io/part-of: vnpt-lakehouse }
---
apiVersion: v1
kind: Namespace
metadata:
  name: trino               # Trino 483 (chart 1.44.0), single node, read-only on the lake (Task 3, D11)
  labels: { app.kubernetes.io/part-of: vnpt-lakehouse }
---
apiVersion: v1
kind: Namespace
metadata:
  name: starrocks           # StarRocks 3.5.21 (kube-starrocks 1.11.8): operator, FE, BE; Gold layer (Task 4)
  labels: { app.kubernetes.io/part-of: vnpt-lakehouse }
