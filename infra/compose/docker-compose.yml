# Task 1: MinIO + Postgres + Hive Metastore + Spark runner
# Usage (from repo root):  make up   then   make bronze
name: vnpt-lake

services:
  minio-perms:           # one-shot: give the MinIO data volume to uid 65532 (Chainguard non-root user)
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 65532:65532 /data && echo perms ok"]
    volumes: [minio-data:/data]

  minio:
    image: ${MINIO_IMAGE}
    command: ["server", "/data", "--console-address", ":9001"]
    depends_on:
      minio-perms: { condition: service_completed_successfully }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    mem_limit: 512m
    restart: unless-stopped
    # no healthcheck: the image has no shell/curl; minio-init retries instead

  minio-init:            # one-shot: wait for MinIO, create bucket, then exit
    image: ${AWSCLI_IMAGE}
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do echo waiting for minio; sleep 2; done
        aws --endpoint-url http://minio:9000 s3 mb s3://lakehouse || echo "bucket exists"
        aws --endpoint-url http://minio:9000 s3 ls
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: metastore
    volumes: [pg-data:/var/lib/postgresql/data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d metastore"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  jars-init:             # one-shot: fetch HMS jars into ./jars (git-ignored), SHA-1 checked
    image: ${CURL_IMAGE}
    user: "1000:1000"    # = quang, so the files on the host are owned by you
    entrypoint: ["sh", "/fetch-jars.sh"]
    environment:
      HADOOP_AWS_VERSION: ${HADOOP_AWS_VERSION}
      AWS_SDK_BUNDLE_VERSION: ${AWS_SDK_BUNDLE_VERSION}
      PG_JDBC_VERSION: ${PG_JDBC_VERSION}
    volumes:
      - ./fetch-jars.sh:/fetch-jars.sh:ro
      - ./jars:/jars

  hive-metastore:        # official image; S3A + JDBC jars and core-site.xml are mounted (no build)
    image: ${HIVE_IMAGE}
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      jars-init: { condition: service_completed_successfully }
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"    # schema 3.1.0 already in Postgres -> skip schematool -initSchema (E07)
      SERVICE_OPTS: >-
        -Xmx768m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${PG_USER}
        -Djavax.jdo.option.ConnectionPassword=${PG_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:             # hadoop-aws MUST equal the image's hadoop-common (3.1.0), see E17
      - ./jars/hadoop-aws-${HADOOP_AWS_VERSION}.jar:/opt/hive/lib/hadoop-aws-${HADOOP_AWS_VERSION}.jar:ro
      - ./jars/aws-java-sdk-bundle-${AWS_SDK_BUNDLE_VERSION}.jar:/opt/hive/lib/aws-java-sdk-bundle-${AWS_SDK_BUNDLE_VERSION}.jar:ro
      - ./jars/postgresql-${PG_JDBC_VERSION}.jar:/opt/hive/lib/postgres.jar:ro
      - ./hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    ports: ["9083:9083"]
    mem_limit: 1g
    restart: unless-stopped

  spark-init:            # one-shot (root): pip deps into the pydeps volume; make the Ivy cache writable for uid 185
    image: ${SPARK_IMAGE}
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        chown 185:185 /opt/ivy
        if cmp -s /req/requirements.txt /opt/pydeps/.requirements.txt; then echo "pydeps up to date"; exit 0; fi
        rm -rf /opt/pydeps/*
        python3 -m pip install --no-cache-dir --disable-pip-version-check --target /opt/pydeps -r /req/requirements.txt
        cp /req/requirements.txt /opt/pydeps/.requirements.txt
        echo "pydeps installed"
    volumes:
      - ./spark/requirements.txt:/req/requirements.txt:ro
      - pydeps:/opt/pydeps
      - ivy-cache:/opt/ivy

  spark:                 # official image; runner container, idle until `make bronze`  execs a job
    image: ${SPARK_IMAGE}
    depends_on:
      hive-metastore: { condition: service_started }
      spark-init: { condition: service_completed_successfully }
    command: ["sleep", "infinity"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      PYTHONPATH: /opt/pydeps  #spark-submit appends pyspark to this
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy-cache:/opt/ivy
      - pydeps:/opt/pydeps:ro
      - ../../jobs:/opt/jobs:ro
      - ${RAW_DATA_DIR}:/data/raw:ro #Excel files, read-only
    ports: ["4040:4040"]                         # Spark UI while a job runs
    mem_limit: 3g

volumes:
  minio-data:
  pg-data:
  ivy-cache:
  pydeps:
