# Superset 6.1.0 on the official chart superset 0.22.8 (Task 5 step 5.3). Chart from GitHub Releases, cached + SHA-256
# (make superset-chart). make superset-render renders it and runs tools/superset_render_check.py (also in CI).
# What we turn off and why (03_plan.md D21, D24):
#  - postgresql / redis subcharts, cache (Redis), Celery worker/beat, websockets: one web pod, Gold is pre-aggregated
#  - init Job: it creates the admin from chart values (default password "admin"); values end up in the Helm release
#    Secret (E35). Our own Job superset-init does db upgrade / init / admin from Secret superset-init-credentials.
#  - secretEnv: the chart would create its own env Secret from database.* values; we use Secret superset-env
#    (rendered by make k8s-secrets: SUPERSET_SECRET_KEY + DB_HOST/DB_PORT/DB_USER/DB_PASS/DB_NAME), which the chart's
#    superset_config.py reads with env() (_helpers.tpl "superset.config", 0.22.8). Superset reads SUPERSET_SECRET_KEY.
image:
  repository: ghcr.io/beno1tp/vnpt-lake-superset
  # = SUPERSET_IMAGE_REF in infra/k8s/images.env (the render check fails if they differ); tag = git SHA of the build
  tag: "4662349da32b6ce197c3bc66843d007a5b67f002@sha256:a0307416f2641b2394a095901e28e00e5e9659ad222ebf4f07298ef0de04946b"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull

runAsUser: 1000                          # user superset of the image (CI superset-image prints `id`); chart default 0 = root

secretEnv:
  create: false
envFromSecret: superset-env

postgresql:
  enabled: false
redis:
  enabled: false
cache:
  enabled: false
init:
  enabled: false
supersetWorker:
  replicas:
    enabled: false
supersetCeleryBeat:
  enabled: false
supersetWebsockets:
  enabled: false

supersetNode:
  replicas:
    enabled: true
    replicaCount: 1
  # the chart's default init container waits for Postgres AND Redis with apache/superset:dockerize (a moving tag);
  # ours waits for Postgres only, with the same pinned image (Python socket check, no extra image to pull)
  initContainers:
    - name: wait-for-postgres
      image: "ghcr.io/beno1tp/vnpt-lake-superset:4662349da32b6ce197c3bc66843d007a5b67f002@sha256:a0307416f2641b2394a095901e28e00e5e9659ad222ebf4f07298ef0de04946b"
      imagePullPolicy: IfNotPresent
      envFrom:
        - secretRef: { name: superset-env }
      command:
        - python
        - -c
        - |
          import os, socket, time
          for i in range(120):
              try:
                  socket.create_connection((os.environ["DB_HOST"], int(os.environ["DB_PORT"])), 3).close()
                  print("postgres reachable"); break
              except OSError:
                  print(f"waiting for postgres ({i + 1}/120)"); time.sleep(5)
          else:
              raise SystemExit("postgres not reachable after 10 min")
      resources: { requests: { memory: 64Mi, cpu: 50m }, limits: { memory: 256Mi } }
  resources:                             # 02_config.md §2; measured at 5.3b
    requests: { memory: 1Gi, cpu: 200m }
    limits: { memory: 1536Mi }
