# Apache Airflow chart 1.22.0 with Airflow 3.3.2 (decision D1: the chart only branches on >=3.0.0, docs/task2/02_config.md).
# Install: make airflow-install, then make airflow-admin (admin user from infra/k8s/secrets/, never in Helm values: E35)
# Image (D5): ghcr.io/beno1tp/vnpt-lake-airflow = apache/airflow:3.3.2-python3.12 + dags/ baked in, built by CI.
# The digest is NOT in this file: make airflow-install passes AIRFLOW_IMAGE_REF from infra/k8s/images.env
# (--set images.airflow.digest), so images.env stays the single record of what is deployed.

airflowVersion: "3.3.2"
# containers that do not need our code (chart helper "default_airflow_image") use the official base; same layers as
# our image (FROM it), so no extra download
defaultAirflowRepository: apache/airflow
defaultAirflowTag: "3.3.2-python3.12"
defaultAirflowDigest: sha256:9df9c8be4096b9cc626bd7cb1f2b8c712eef66c59c615f8c7e6200871ca10bd1
images:
  airflow:
    repository: ghcr.io/beno1tp/vnpt-lake-airflow
    tag: ~                          # digest only (set by make)
    pullPolicy: IfNotPresent
imagePullSecrets: [ghcr-pull]       # private GHCR package, token read:packages only (2.0c); `registry:` is deprecated

executor: LocalExecutor             # tasks run inside the scheduler pod; heavy work runs in Spark pods

# external Postgres in namespace lake (DB + role "airflow" created by infra/k8s/lake/postgres-initdb)
postgresql: { enabled: false }      # bundled Bitnami subchart off
data:
  metadataSecretName: airflow-metadata
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret

# components not needed with LocalExecutor / in this lab
redis: { enabled: false }
statsd: { enabled: false }
pgbouncer: { enabled: false }
flower: { enabled: false }
workers:
  celery:
    persistence: { enabled: false } # with LocalExecutor this would turn the scheduler into a StatefulSet + 100Gi PVC
enableServiceLinks: false           # we use DNS names; avoids the chart-2.0 default-change warning
dags:
  gitSync:
    recommendedProbeSetting: true   # not used (DAGs are baked in); silences the deprecation warning

# --wait + Helm hooks deadlock (pods wait for the migration job that only runs after they are ready): plain Jobs
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  resources: { requests: { memory: 256Mi, cpu: 100m }, limits: { memory: 768Mi } }
createUserJob:
  enabled: false                    # E35: the chart's NOTES print defaultUser.password after every install/upgrade;
                                    # the admin user is created by `make airflow-admin` from the secret file instead

config:
  core:
    load_examples: "False"
    parallelism: 4                  # max concurrent task processes in the scheduler pod (RAM)
    default_timezone: utc

apiServer:
  resources: { requests: { memory: 512Mi, cpu: 200m }, limits: { memory: 1Gi } }
scheduler:
  resources: { requests: { memory: 512Mi, cpu: 200m }, limits: { memory: 1Gi } }
  logGroomerSidecar:
    resources: { requests: { memory: 32Mi, cpu: 10m }, limits: { memory: 128Mi } }
dagProcessor:
  resources: { requests: { memory: 256Mi, cpu: 100m }, limits: { memory: 768Mi } }
  logGroomerSidecar:
    resources: { requests: { memory: 32Mi, cpu: 10m }, limits: { memory: 128Mi } }
triggerer:
  persistence: { enabled: false }   # logs PVC not needed in the lab
  resources: { requests: { memory: 256Mi, cpu: 100m }, limits: { memory: 768Mi } }
  logGroomerSidecar:
    resources: { requests: { memory: 32Mi, cpu: 10m }, limits: { memory: 128Mi } }
