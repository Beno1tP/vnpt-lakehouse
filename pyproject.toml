# Tooling config only (the jobs run with the Spark image's Python 3.10 and docker/spark/requirements.txt).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["infra/compose/__pycache__"]

[tool.ruff.lint]
# explicit rule set, so a newer ruff default cannot turn CI red by itself
select = ["E", "F", "I", "B", "SIM", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["bronze_ingest", "validate_bronze", "landing_simulator", "lake_alerts", "catalog_tool"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["jobs", "infra/k8s", "plugins"]
addopts = "-q"
