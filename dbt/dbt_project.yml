# Task 4: Gold layer in StarRocks, built by dbt (docs/task4/01_knowledge.md A4/A5). Database (= dbt schema) `gold`.
# Artifact and log paths come from DBT_TARGET_PATH / DBT_LOG_PATH in the image (dbt 1.12 deprecates them here).
name: vnpt_gold
version: "1.0.0"
config-version: 2
profile: vnpt_gold
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
vars:
  period_start: "2024-07-02"     # the whole dataset (docs/metrics.md "Period"); dim_date spans it, zero days included
  period_end: "2024-07-25"
models:
  vnpt_gold:
    staging:
      +materialized: view
    marts:
      +materialized: table
    gold:
      +materialized: table
seeds:
  vnpt_gold:
    # expected values from tools/expected_gold.py (pandas); explicit types so the reconcile tests compare like with like
    expected_gold_uc4:
      +column_types: { event_date: date, step: varchar(32), traffic_class: varchar(16), message_cnt: bigint }
    expected_gold_uc5:
      +column_types: { event_date: date, traffic_class: varchar(16), understood_cnt: bigint, not_understood_cnt: bigint }
    expected_gold_uc6:
      +column_types:
        { event_date: date, final_intent: varchar(64), intent_group: varchar(32), traffic_class: varchar(16), message_cnt: bigint }
    expected_gold_uc7:
      +column_types:
        { event_date: date, user_class: varchar(16), cumulative_users: bigint, users_30d_before: bigint, change_abs: bigint, change_pct: double }
    expected_gold_uc8:
      +column_types: { event_date: date, user_class: varchar(16), new_users: bigint, active_users: bigint }
    scenario_labels:
      +column_types: { step: varchar(32), scenario: varchar(64), label_source: varchar(32) }
